<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파라보그 스프라이트 튜너</title>
<style>
  :root{
    --ink:#eaf2f3; --dim:#8ba7ad; --bg:#15272d; --deep:#0f1c21;
    --line:rgba(180,214,220,.18); --hot:#f0703c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--deep);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:var(--dim);font-size:13px;line-height:1.6}

  .stage{position:relative;height:340px;border-radius:14px;overflow:hidden;
         background:radial-gradient(120% 90% at 50% 0%,#1d343c 0%,var(--bg) 55%,#0e1b20 100%);
         border:1px solid var(--line);touch-action:none;cursor:crosshair}
  .floor{position:absolute;left:0;right:0;bottom:0;height:90px;
         background:linear-gradient(180deg,transparent,rgba(0,0,0,.45));}
  .hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--dim)}
  .bug{position:absolute;left:0;top:0;will-change:transform;
       filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));pointer-events:none}
  .bug img{display:block;width:100%;height:auto}

  .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
         gap:14px 22px;margin-top:20px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--hot)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{background:transparent;border:1px solid var(--line);color:var(--ink);
         padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
  button[aria-pressed=true]{border-color:var(--hot);color:var(--hot)}
  button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

  pre{margin:18px 0 0;padding:14px;border-radius:12px;background:#0b1519;
      border:1px solid var(--line);color:#cfe3e7;font-size:12px;line-height:1.65;
      overflow:auto;white-space:pre}
  .note{font-size:12.5px;color:var(--dim);line-height:1.75;margin-top:14px}
  code{color:#ffd7a8}
  @media (prefers-reduced-motion: reduce){ .bug{transition:none} }
</style>
<div class="wrap">
  <h1>파라보그 스프라이트 튜너</h1>
  <p class="sub">실제 연구 사진에서 딴 두 마리입니다. 무대를 누르거나 끌면 그쪽으로 이동하고, 뒤쪽 개체는 설정한 간격만큼 앞선 개체의 자취를 따라갑니다.</p>

  <div class="panel">
    <div><label>크기 <b id="vSize">96</b>px</label>
      <input id="size" type="range" min="40" max="220" value="96"></div>
    <div><label>두 마리 간격 <b id="vGap">120</b>px</label>
      <input id="gap" type="range" min="0" max="320" value="120"></div>
    <div><label>속도 <b id="vSpd">2.6</b></label>
      <input id="spd" type="range" min="0.5" max="8" step="0.1" value="2.6"></div>
    <div><label>걸음 흔들림 <b id="vBob">5</b></label>
      <input id="bob" type="range" min="0" max="14" value="5"></div>
  </div>

  <div class="row">
    <button id="mode" aria-pressed="false">자동 순찰로 바꾸기</button>
    <button id="swap">앞뒤 순서 바꾸기</button>
    <button id="copy">아래 코드 복사</button>
  </div>

  <pre id="code"></pre>
  <p class="note">이 값들은 <code>--bug-size</code>, <code>--bug-gap</code>, <code>--bug-speed</code>, <code>--bug-bob</code> 네 개의 CSS 변수로 나옵니다. 페이지 쪽 스크립트에서 같은 이름으로 읽어 쓰면 됩니다.</p>
</div>

<script>
const stage=document.getElementById('stage');
const bugs=[document.getElementById('b1'),document.getElementById('b2')];
const S={size:96,gap:120,spd:2.6,bob:5,auto:false,order:[0,1]};
const lead={x:140,y:250}, target={x:520,y:250};
let trail=[], t=0, wp=0;

function rect(){return stage.getBoundingClientRect();}
function waypoints(){const r=rect();return [
  {x:r.width*.18,y:r.height*.72},{x:r.width*.46,y:r.height*.44},
  {x:r.width*.78,y:r.height*.70},{x:r.width*.52,y:r.height*.82}];}

stage.addEventListener('pointerdown',e=>{S.auto=false;sync();move(e)});
stage.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});
function move(e){const r=rect();target.x=e.clientX-r.left;target.y=e.clientY-r.top;
  document.getElementById('hint').style.opacity=0;}

function frame(){
  t+=1;
  if(S.auto){const w=waypoints()[wp];target.x=w.x;target.y=w.y;
    if(Math.hypot(w.x-lead.x,w.y-lead.y)<24) wp=(wp+1)%4;}
  const dx=target.x-lead.x, dy=target.y-lead.y, d=Math.hypot(dx,dy);
  const step=Math.min(S.spd, d);
  if(d>1){lead.x+=dx/d*step; lead.y+=dy/d*step;}
  trail.unshift({x:lead.x,y:lead.y,h:dx});
  if(trail.length>1400) trail.pop();

  let acc=0, follow=trail[trail.length-1]||lead;
  for(let i=1;i<trail.length;i++){
    acc+=Math.hypot(trail[i].x-trail[i-1].x, trail[i].y-trail[i-1].y);
    if(acc>=S.gap){follow=trail[i];break;}
  }
  place(bugs[S.order[0]], lead.x, lead.y, dx, 0);
  place(bugs[S.order[1]], follow.x, follow.y, follow.h ?? dx, 1);
  requestAnimationFrame(frame);
}
function place(el,x,y,h,i){
  const w=S.size, bob=Math.sin((t+i*11)/6)*S.bob*(Math.min(1,Math.hypot(target.x-lead.x,target.y-lead.y)/6));
  const tilt=Math.sin((t+i*11)/6)*1.6;
  el.style.width=w+'px';
  el.style.transform=`translate(${x-w/2}px, ${y-w/2+bob}px) rotate(${tilt}deg) scaleX(${h<0?-1:1})`;
}
function sync(){
  document.getElementById('vSize').textContent=S.size;
  document.getElementById('vGap').textContent=S.gap;
  document.getElementById('vSpd').textContent=S.spd.toFixed(1);
  document.getElementById('vBob').textContent=S.bob;
  const m=document.getElementById('mode');
  m.setAttribute('aria-pressed',S.auto);
  m.textContent=S.auto?'손으로 조종하기':'자동 순찰로 바꾸기';
  document.getElementById('code').textContent=
`:root{
  --bug-size: ${S.size}px;   /* 스프라이트 가로 폭 */
  --bug-gap:  ${S.gap}px;    /* 앞뒤 두 마리 사이 거리 */
  --bug-speed: ${S.spd.toFixed(1)};    /* 프레임당 이동 px */
  --bug-bob:  ${S.bob}px;    /* 위아래 걸음 흔들림 */
}
.paraborg{
  width: var(--bug-size);
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.55));
}
/* 진행 방향이 왼쪽일 때만 */
.paraborg.is-left{ transform: scaleX(-1); }`;
}
for(const [id,key,f] of [['size','size',Number],['gap','gap',Number],['spd','spd',Number],['bob','bob',Number]]){
  document.getElementById(id).addEventListener('input',e=>{S[key]=f(e.target.value);sync();});
}
document.getElementById('mode').onclick=()=>{S.auto=!S.auto;sync();};
document.getElementById('swap').onclick=()=>{S.order.reverse();};
document.getElementById('copy').onclick=async b=>{
  await navigator.clipboard.writeText(document.getElementById('code').textContent);
  const el=document.getElementById('copy'); el.textContent='복사했습니다'; setTimeout(()=>el.textContent='아래 코드 복사',1400);
};
sync(); frame();
</script>
